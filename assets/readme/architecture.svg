<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual alert-to-review workflow and separate offline video baseline</title>
  <desc id="desc">Four labeled stages distinguish an assumed external alert, simulated wind-aware dispatch, proposed thermal confirmation and mapping, and operator review. A separate offline RGB recorded-video baseline is explicitly disconnected from the alert flow.</desc>
  <rect width="1120" height="420" fill="#fff"/>
  <text x="40" y="47" fill="#006bff" font-family="Geist, system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1.8">CONCEPTUAL RESEARCH WORKFLOW</text>
  <text x="40" y="76" fill="#14243a" font-family="Geist, system-ui, sans-serif" font-size="22" font-weight="600">Evidence boundaries are part of the model.</text>

  <rect x="40" y="105" width="230" height="166" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="58" y="134" fill="#006bff" font-family="Geist, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.1">ASSUMED INPUT</text>
  <text x="58" y="171" fill="#14243a" font-family="Geist, system-ui, sans-serif" font-size="22" font-weight="700">External alert</text>
  <text x="58" y="205" fill="#334155" font-family="Geist, system-ui, sans-serif" font-size="17">Reported location/time.</text>
  <text x="58" y="232" fill="#64748b" font-family="Geist, system-ui, sans-serif" font-size="16">Upstream detection is</text>
  <text x="58" y="253" fill="#64748b" font-family="Geist, system-ui, sans-serif" font-size="16">outside this model.</text>

  <path d="M278 188h30m-8-8 8 8-8 8" fill="none" stroke="#64748b" stroke-width="2"/>
  <rect x="320" y="105" width="230" height="166" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="338" y="134" fill="#006bff" font-family="Geist, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.1">SIMULATED</text>
  <text x="338" y="171" fill="#14243a" font-family="Geist, system-ui, sans-serif" font-size="22" font-weight="700">Wind-aware dispatch</text>
  <text x="338" y="205" fill="#334155" font-family="Geist, system-ui, sans-serif" font-size="17">Fleet contention, reserve</text>
  <text x="338" y="232" fill="#64748b" font-family="Geist, system-ui, sans-serif" font-size="16">and fixed-wind scenarios.</text>
  <text x="338" y="253" fill="#64748b" font-family="Geist, system-ui, sans-serif" font-size="16">No aircraft is controlled.</text>

  <path d="M558 188h30m-8-8 8 8-8 8" fill="none" stroke="#64748b" stroke-width="2"/>
  <rect x="600" y="105" width="230" height="166" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="618" y="134" fill="#64748b" font-family="Geist, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.1">PROPOSED WORKFLOW</text>
  <text x="618" y="170" fill="#14243a" font-family="Geist, system-ui, sans-serif" font-size="21" font-weight="700">Thermal confirmation</text>
  <text x="618" y="198" fill="#14243a" font-family="Geist, system-ui, sans-serif" font-size="21" font-weight="700">and mapping</text>
  <text x="618" y="232" fill="#64748b" font-family="Geist, system-ui, sans-serif" font-size="16">No autonomous thermal</text>
  <text x="618" y="253" fill="#64748b" font-family="Geist, system-ui, sans-serif" font-size="16">pipeline is implemented.</text>

  <path d="M838 188h30m-8-8 8 8-8 8" fill="none" stroke="#64748b" stroke-width="2"/>
  <rect x="880" y="105" width="200" height="166" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="898" y="134" fill="#64748b" font-family="Geist, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.1">OPERATOR WORKFLOW</text>
  <text x="898" y="171" fill="#14243a" font-family="Geist, system-ui, sans-serif" font-size="22" font-weight="700">Human review</text>
  <text x="898" y="205" fill="#334155" font-family="Geist, system-ui, sans-serif" font-size="17">Review and decide.</text>
  <text x="898" y="232" fill="#64748b" font-family="Geist, system-ui, sans-serif" font-size="16">No live deployment or</text>
  <text x="898" y="253" fill="#64748b" font-family="Geist, system-ui, sans-serif" font-size="16">flight control.</text>

  <path d="M40 301h1040" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5 6"/>
  <text x="40" y="332" fill="#64748b" font-family="Geist, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">SEPARATE OFFLINE LANE · NOT CONNECTED TO LIVE ALERT FLOW</text>
  <text x="40" y="373" fill="#14243a" font-family="Geist, system-ui, sans-serif" font-size="18" font-weight="600">Recorded local video</text>
  <path d="M253 367h36m-8-8 8 8-8 8" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="306" y="373" fill="#14243a" font-family="Geist, system-ui, sans-serif" font-size="18" font-weight="600">RGB color/persistence baseline</text>
  <path d="M603 367h36m-8-8 8 8-8 8" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="656" y="373" fill="#334155" font-family="Geist, system-ui, sans-serif" font-size="17">Sample-index predictions for review</text>
  <text x="40" y="402" fill="#64748b" font-family="Geist, system-ui, sans-serif" font-size="15">Not smoke detection · not thermal inference · not a probability</text>
</svg>

    <text x="48" y="433" fill="#14243a" font-size="18" font-weight="650">25 bases · 1 drone/base</text>
    <text x="48" y="459" fill="#64748b" font-size="16">12 m/s wind · 252.48 EUR/km²/yr</text>
    <rect x="413" y="415" width="507" height="30" fill="#1e3a5f"/>
    <text x="938" y="437" fill="#14243a" font-size="21" font-weight="700">97.51%</text>
